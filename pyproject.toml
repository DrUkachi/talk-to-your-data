[project]
name = "talk-to-your-data"
version = "0.1.0"
description = "Agentic analytics system: ask a business question in Slack, get an answer, a chart, and the SQL that produced it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pandasai>=2.3",
    "slack-bolt>=1.20",
    "langfuse>=2.50",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
data = [
    "kagglehub>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["scripts"]
markers = ["integration: requires Docker Postgres running with data loaded (scripts/load_data.py)"]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.11"
packages = ["talk_to_your_data"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk_to_your_data"]
