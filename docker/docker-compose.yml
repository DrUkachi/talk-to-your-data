services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cleaning-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      # Inside the compose network Postgres is reachable at the service name,
      # not localhost -- .env's POSTGRES_HOST is for host-machine access.
      POSTGRES_HOST: postgres
    ports:
      - "${CLEANING_API_PORT}:8001"
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "talk_to_your_data.mcp_server.server"]
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      # 127.0.0.1 (the .env default, for host-machine access) isn't reachable
      # from outside this container's network namespace.
      MCP_SERVER_HOST: "0.0.0.0"
    ports:
      - "${MCP_SERVER_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  eda-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      [
        "uvicorn",
        "talk_to_your_data.agents.eda.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
      ]
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      MCP_SERVER_HOST: mcp-server
      # Must be the address a client can actually reach this service at --
      # ask_question() needs an EDA_API_BASE_URL/a2a client to resolve "http://
      # localhost:${EDA_API_PORT}" from the host machine. See api.py's comment.
      EDA_API_BASE_URL: "http://localhost:${EDA_API_PORT}"
    ports:
      - "${EDA_API_PORT}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started

volumes:
  pgdata:
