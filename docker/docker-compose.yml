services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cleaning-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      # Inside the compose network Postgres is reachable at the service name,
      # not localhost -- .env's POSTGRES_HOST is for host-machine access.
      POSTGRES_HOST: postgres
    ports:
      - "${CLEANING_API_PORT}:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
